[server]
addr = ":8080"
data_dir = "data"
web_dir = "web/dist"
ops_controls = true
ops_reset_min = 15
max_human_drivers = 200
rate_per_second = 5.0
rate_burst = 20
frame_ms = 1000
quote_secret = ""
map_style = "https://tiles.openfreemap.org/styles/dark"
map_style_light = "https://tiles.openfreemap.org/styles/positron"

[clock]
mode = "new_york"
start = "17:30"
speed = 1.0
warmup_min = 90

[dispatch]
policy = "batch"
batch_window_ms = 2000
offer_timeout_s = 15
max_pickup_s = 900
search_rings = 10
max_candidates = 25
max_batch = 300
request_timeout_s = 600
back_to_back = true
b2b_max_remaining_s = 180
cancel_grace_s = 120
cancel_fee = 5.0
arrive_radius_m = 250.0
age_weight = 0.2
dropoff_dwell_s = 15.0
visitor_head_start_s = 300.0

[pricing]
comfort_multiplier = 1.3
xl_multiplier = 1.6
driver_surge_share = 0.5
quote_ttl_s = 180

[surge]
enabled = true
resolution = 8
tick_s = 10
half_life_s = 120
target_eta_s = 360.0
sensitivity = 0.5
max = 3.0
step_up = 0.1
step_down = 0.1

[sim]
enabled = true
seed = 7
demand_scale = 1.0
fleet_base = 600
fleet_scale = 1.0
supply_response = 0.5
accept_rate = 0.92
decide_min_s = 2.0
decide_max_s = 8.0
price_sensitivity = 0.6
patience_min_s = 240.0
patience_max_s = 720.0
max_acceptable_eta_s = 900.0
board_min_s = 20.0
board_max_s = 60.0
dropoff_s = 15.0
reposition_after_s = 240.0
reposition_radius_m = 2500.0
location_every_s = 1.0
comfort_share = 0.12
xl_share = 0.08
comfort_fleet_share = 0.15
xl_fleet_share = 0.1
manual_timeout_s = 90.0

[store]
url = ""
flush_ms = 500
retention_hours = 6
